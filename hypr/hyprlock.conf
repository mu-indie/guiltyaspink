$wall = /home/bess/Pictures/GG/sol-axl.jpg
$music = /home/bess/.config/hypr/nowplaying/nowplaying.sh


background {
    monitor =
    path = $wall
    blur_passes = 0
    blur_size = 0
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}


input-field {
    monitor =
    size = 200, 50
    outline_thickness = 2
    dots_size = 0.33 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.15 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    dots_rounding = -1 # -1 default circle, -2 follow input-field rounding
    outer_color = rgb(151515)
    inner_color = rgb(FFFFFF)
    font_color = rgb(10, 10, 10)
    fade_on_empty = true
    fade_timeout = 1000 # Milliseconds before fade_on_empty is triggered.
    placeholder_text = <i>Input Password...</i> # Text rendered in the input box when it's empty.
    hide_input = false
    rounding = -1 # -1 means complete rounding (circle/oval)
    check_color = rgb(204, 136, 34)
    fail_color = rgb(204, 34, 34) # if authentication failed, changes outer_color and fail message color
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i> # can be set to empty
    fail_transition = 300 # transition time in ms between normal outer_color and fail_color
    capslock_color = -1
    numlock_color = -1
    bothlock_color = -1 # when both locks are active. -1 means don't change outer color (same for above)
    invert_numlock = false # change color if numlock is off
    swap_font_color = false # see below
    position = 0, -20
    halign = center
    valign = center
}


label {
    monitor =
    #clock
    #text = cmd[update:1000] echo "$TIME", $LAYOUT[en,ara]
    text = cmd[update:1000] echo "<span foreground='##cba6f7'>$(date "+%a %b %d %H:%M")</span>"
    color = rgba(200, 200, 200, 1.0)
    font_size = 20
    font_family = Departure Mono Nerd Font
    position = -50, 90
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

label {
    monitor =
    text = Hi there, $USER
    color = rgba(200, 200, 200, 1.0)
    font_size = 16
    font_family = Departure Mono Nerd Font
    position = -100, 160
    halign = right
    valign = bottom
    shadow_passes = 5
    shadow_size = 10
}

# Battery
label {
    monitor =
    text = cmd[update:30] echo "$(cat /sys/class/power_supply/BAT0/capacity)%"
    color = rgba(200, 200, 200, 1.0)
    font_size = 16
    font_family = Departure Mono Nerd Font Mono 
    position = 50,90
    halign = left
    valign = bottom
    zindex = 5
}

# Song title
label {
  monitor =
  text = cmd[update:600] $music --title
  color = rgba(255, 255, 255, 0.9)
  font_size = 15
  font_family = DepartureMono Nerd Font Mono
  position = 0, 130
  max_width = 10
  halign = center
  valign = bottom
  zindex = 5
}

# Artist
label {
  monitor =
  text = cmd[update:600] $music --artist
  color = rgba(255, 255, 255, 0.6)
  font_size = 14
  font_family = DepartureMono Nerd Font
  position = 0, 90
  halign = center
  valign = bottom
  zindex = 5
}

# Album art
image {
  monitor =
  path = /tmp/hyde-mpris.png
  size = 80
  rounding = 8
  reload_time = 0
  position = 0, 160
  halign = center
  valign = bottom
  border_size = 4
  border_color = rgba(cba6f7ff)
  zindex = 5
}